# System Configuration – Optimalizált fehér focilabda detektáláshoz
# Real-Time 3D Ball Detection and Robot Goalkeeper Control

# ---------------------------------------------------------------------------
# Network (PC → Raspberry Pi)
# ---------------------------------------------------------------------------
network:
  rpi_ip: "127.0.0.1"
  port: 5005

# ---------------------------------------------------------------------------
# Camera
# Type options: "ximea" | "mock" | "opencv" | "mindvision"
# ---------------------------------------------------------------------------
camera:
  type: "ximea"
  resolution:
    width: 1280
    height: 720
  fps: 60
  exposure_time_us: 800
  gain: 0.0
  bandwidth_limit_mbs: 160

# ---------------------------------------------------------------------------
# Stereo vision
# ---------------------------------------------------------------------------
stereo:
  baseline_mm: 300.0
  focal_length_px: 1200.0
  principal_point_x: 640.0
  principal_point_y: 360.0
  left_camera_index: 0
  right_camera_index: 1

# ---------------------------------------------------------------------------
# Pálya és kamera geometria – KÖTELEZŐ a helyszíni telepítés előtt mérni!
#
# TELEPÍTÉSI ELRENDEZÉS:
# - A két kamera a pálya két sarkában helyezkedik el, a kapussal egy vonalban.
# - A kamerák párhuzamosan néznek BEFELÉ a pályára (a labda érkezési iránya felé).
# - Az 'X' tengely a két kamera közötti vonal (jobb-bal irány).
# - Az 'Y' tengely a magasság (függőleges).
# - A 'Z' tengely a mélység: Z=0 a kamerák síkja, a pálya közepe felé növekszik.
# ---------------------------------------------------------------------------
field_geometry:
  # A kamerák lencséjének pontos magassága a talajtól (mm-ben). 
  # (Mindkét kamerának azonos magasságban kell lennie!)
  camera_height_mm: 1200.0
  
  # A bal és jobb kamera lencséjének középpontja közötti VÍZSZINTES távolság (mm).
  # Mivel a sarkokban vannak, ez nagyjából a pálya szélessége.
  baseline_mm: 300.0
  
  # Az objektív fizikai fókusztávolsága (rá van írva a lencsére, pl. 6.0 mm).
  focal_length_mm: 6.0
  
  # A kamera képérzékelő chipjének valós fizikai mérete (mm-ben).
  # XIMEA MC023CG-SY-UB esetén: szélesség = 5.71, magasság = 3.25
  sensor_width_mm: 5.71
  sensor_height_mm: 3.25
  
  # A kapus (gólvonal) távolsága a kamerák vetítési síkjától a Z tengelyen.
  # Ha a kamerák pontosan a kapussal egy vonalban vannak (ahogy írtad), ez 0.0 mm.
  # Ha a kamerák a kapus mögött vannak fél méterrel, akkor ez 500.0 mm.
  goal_distance_mm: 0.0
  
  # A kapu nyílásának méretei (mm-ben) - ez csak a rajzoláshoz (3D nézet) kell.
  goal_width_mm: 1830.0
  goal_height_mm: 1220.0


# ---------------------------------------------------------------------------
# Ball detection
#
# MODELL VÁLASZTÁS:
#  1. Pretetrained COCO (azonnal fut, de lassú):
#       yolo_model_path: "yolov8l.pt"          ← pontosan felismeri, ~16-20 FPS
#       yolo_model_path: "yolov8n.pt"          ← gyors, de COCO-n nem ismeri a labdát
#
#  2. CUSTOM (AJÁNLOTT – saját képeken tanított, gyors ÉS pontos):
#       yolo_model_path: "models/custom_ball.pt"  ← betanítás után ez a cél!
#       → Tanítás: python scripts/collect_training_frames.py
#                  python scripts/auto_label.py
#                  python scripts/train_custom_ball.py
# ---------------------------------------------------------------------------
detection:
  method: "yolo"

  # === JELENLEG AKTÍV MODELL ===
  # Csere után: "models/custom_ball.pt"
  yolo_model_path: "models/custom_ball.engine"

  # COCO sports ball osztályindex: 32
  # Custom modellnél (1 osztályos): 0
  # Ha custom_ball.pt-t használsz, állítsd 0-ra!
  yolo_class_filter: 0

  # Küszöb: COCO modellnél 0.3-0.4, custom modellnél 0.5+ ajánlott
  confidence_threshold: 0.35

  # ── HSV maszk – fehér focilabda ──────────────────────────────────────────
  # FONTOS VÁLTOZÁS: lower_v = 160 (volt: 200)
  # A focilabda BELSEJÉT SÖTÉT MINTÁK tarkítják → az átlagos fényesség alacsonyabb.
  # A 160-as V küszöb beengedi az árnyékos/mintás területeket is.
  # lower_s = 0, upper_s = 60: alacsony szaturáció = fehér/szürke területek
  hsv_bounds:
    lower_h: 0
    lower_s: 0
    lower_v: 160      # ← Csökkentve 200 → 160 (mintás labda belseje is látszik)
    upper_h: 180
    upper_s: 60       # ← Növelve 50 → 60 (engedékenyebb fehér szín)
    upper_v: 255

  # ── Hough Circle Transform ────────────────────────────────────────────────
  # Érzékenyebb beállítások (param2 csökkentve): több jelölt kört enged át,
  # a kontúr réteg végez végső szűrést.
  hough:
    min_dist: 25       # ← Csökkentve 30 → 25
    param1: 80         # ← Csökkentve 100 → 80 (engedékenyebb él detektor)
    param2: 25         # ← Csökkentve 30 → 25 (több jelölt kör)
    min_radius: 8
    max_radius: 150    # ← Növelve 120 → 150 (közelről nagyon nagy labda)

  # ── Kalman szűrő ─────────────────────────────────────────────────────────
  kalman:
    enabled: true
    process_noise: 0.01
    measurement_noise: 0.1
    max_coast_frames: 12   # ← Növelve 10 → 12 (kicsit tovább tart ki)

  # ── Region-of-Interest ────────────────────────────────────────────────────
  roi:
    enabled: true
    padding_factor: 3.0   # ← Növelve 2.5 → 3.0 (nagyobb keresési terület)

  # ── Trajectory Prediction (Goal Intercept) ────────────────────────────────
  trajectory:
    enabled: true
    gravity_mm_s2: 9810.0
    goal_z_mm: 500.0  # Milyen távol van a kapus síkja (Z) a kamerától
